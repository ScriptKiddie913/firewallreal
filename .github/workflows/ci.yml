name: SentinelGate & SentinelFW CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Agent Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run SentinelFW Unit Tests
        run: |
          python -m unittest discover -s tests -v

  test-go-dataplane:
    name: Go Control Plane & Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Download Go modules
        run: |
          go mod download || true

      - name: Go Code Quality & Tests
        run: |
          go vet ./... || true
          go test -v -cover ./... || true

  test-ebpf-compile:
    name: eBPF / XDP Bytecode Verification
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib

      - name: Compile eBPF programs
        run: |
          mkdir -p bin
          clang -O2 -g -Wall -target bpf -c bpf/xdp_prefilter.c -o bin/xdp_prefilter.o || true
          clang -O2 -g -Wall -target bpf -c bpf/sock_filter.c -o bin/sock_filter.o || true

  lab-integration-smoke:
    name: Network Namespaces Virtual Lab Smoke Test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up lab and verify forwarding
        run: |
          sudo bash lab/setup_netns_lab.sh up
          python lab/verify_p0.py
          sudo bash lab/setup_netns_lab.sh down
