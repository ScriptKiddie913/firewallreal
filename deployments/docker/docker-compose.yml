version: "3.8"

services:
  sentinelfw:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: sentinelfw
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - sentinelfw_data:/var/lib/sentinelfw
      - /etc/hosts:/etc/hosts
      - /var/log/sentinelfw:/var/lib/sentinelfw/logs
    environment:
      - SENTINELFW_HOME=/var/lib/sentinelfw
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: sentinelfw-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../nginx/sentinelfw.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - sentinelfw

volumes:
  sentinelfw_data:
  certbot_certs:
